name: GitHub Pages

# Publishes only what docs/pages-assets.json selects (see docs/github-pages.md): the landing page and the browser
# demo, whose level streams from its publisher. Runs on pushes to main and on demand.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Check selected game assets
        id: selection
        shell: bash
        run: |
          selected="$(python3 scripts/build_pages.py --check-selection)"
          echo "game=$selected" >> "$GITHUB_OUTPUT"
      - name: Install Rust WebAssembly target
        if: steps.selection.outputs.game == 'true'
        run: rustup toolchain install 1.96.1 --profile minimal --target wasm32-unknown-unknown && rustup default 1.96.1
      - name: Install matching wasm-bindgen
        if: steps.selection.outputs.game == 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Build browser runtime
        if: steps.selection.outputs.game == 'true'
        shell: pwsh
        run: ./scripts/build_web.ps1 -SkipSceneAssets
      - name: Assemble selected Pages content
        run: python3 scripts/build_pages.py
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .artifacts/pages

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          # GitHub's Pages service sometimes takes longer than the default ten minutes to publish.
          timeout: 1200000
