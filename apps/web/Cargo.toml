[package]
name = "countersplat-web"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Browser WebGPU canvas host for CounterSplat"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
countersplat-core.workspace = true
countersplat-scene.workspace = true
countersplat-scene-ecs.workspace = true
countersplat-audio-ecs.workspace = true
countersplat-ecs.workspace = true
countersplat-ui.workspace = true
countersplat-ui-ecs.workspace = true
countersplat-ui-wgpu.workspace = true
countersplat-assets.workspace = true
countersplat-physics.workspace = true
countersplat-render.workspace = true
serde = "1"
serde_json.workspace = true
wgpu.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
web-sys = { version = "=0.3.104", features = ["Window", "Document", "Element", "HtmlCanvasElement", "ImageBitmap", "Performance", "console", "Worker", "WorkerOptions", "WorkerType", "MessageEvent", "ErrorEvent", "Event", "DedicatedWorkerGlobalScope", "WorkerGlobalScope", "RequestInit", "RequestCache", "Response", "AbortSignal", "DomException", "EventTarget", "Storage", "Url", "Headers", "AbortController", "Location", "AudioContext", "BaseAudioContext", "AudioContextState", "AudioNode", "AudioParam", "GainNode", "AudioBuffer", "AudioBufferSourceNode", "AudioScheduledSourceNode", "ChannelSplitterNode", "ChannelMergerNode", "AudioDestinationNode"] }
